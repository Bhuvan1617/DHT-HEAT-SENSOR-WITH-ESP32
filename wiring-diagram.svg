<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold">Wiring: ESP32 + DHT22 + LED</text>

  <!-- ESP32 -->
  <rect x="40" y="70" width="190" height="300" rx="10" fill="#e8eef7" stroke="#333" stroke-width="2"/>
  <text x="135" y="100" text-anchor="middle" font-weight="bold">ESP32 DevKit</text>
  <g text-anchor="start">
    <circle cx="230" cy="150" r="5" fill="#d33"/><text x="215" y="154" text-anchor="end">3V3</text>
    <circle cx="230" cy="200" r="5" fill="#2a8"/><text x="215" y="204" text-anchor="end">GPIO4</text>
    <circle cx="230" cy="250" r="5" fill="#e80"/><text x="215" y="254" text-anchor="end">GPIO18</text>
    <circle cx="230" cy="320" r="5" fill="#111"/><text x="215" y="324" text-anchor="end">GND</text>
  </g>

  <!-- DHT22 -->
  <rect x="520" y="70" width="170" height="130" rx="8" fill="#dff3ff" stroke="#333" stroke-width="2"/>
  <text x="605" y="95" text-anchor="middle" font-weight="bold">DHT22</text>
  <circle cx="520" cy="120" r="5" fill="#d33"/><text x="535" y="124">VCC</text>
  <circle cx="520" cy="150" r="5" fill="#2a8"/><text x="535" y="154">SDA (data)</text>
  <circle cx="520" cy="180" r="5" fill="#111"/><text x="535" y="184">GND</text>

  <!-- Resistor + LED -->
  <rect x="340" y="236" width="80" height="28" fill="#f6e7c8" stroke="#333" stroke-width="2"/>
  <text x="380" y="256" text-anchor="middle">220 Ω</text>
  <polygon points="520,235 520,275 550,255" fill="#f88" stroke="#333" stroke-width="2"/>
  <line x1="550" y1="235" x2="550" y2="275" stroke="#333" stroke-width="3"/>
  <text x="535" y="300" text-anchor="middle">LED (red)</text>
  <text x="505" y="232" text-anchor="end" font-size="12">anode +</text>
  <text x="565" y="232" font-size="12">cathode −</text>

  <!-- Wires -->
  <polyline points="230,150 300,150 300,120 520,120" fill="none" stroke="#d33" stroke-width="3"/>
  <polyline points="230,200 460,200 460,150 520,150" fill="none" stroke="#2a8" stroke-width="3"/>
  <polyline points="230,250 340,250" fill="none" stroke="#e80" stroke-width="3"/>
  <polyline points="420,250 520,255" fill="none" stroke="#e80" stroke-width="3"/>
  <polyline points="550,255 600,255 600,340 280,340 280,320 230,320" fill="none" stroke="#111" stroke-width="3"/>
  <polyline points="520,180 480,180 480,340" fill="none" stroke="#111" stroke-width="3"/>

  <text x="380" y="400" text-anchor="middle" font-size="12" fill="#555">Red = 3.3 V · Green = data · Orange = LED signal · Black = ground</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
